<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Corrente webview spike</title>
    <style>
      :root {
        color-scheme: dark;
        --ground: #14171c;
        --ink: #e8e7e3;
        --muted: #8b929c;
        --you: #56c7c2;
        --line: #2a3038;
      }
      body {
        margin: 0;
        padding: 20px;
        background: var(--ground);
        color: var(--ink);
        font:
          14px/1.4 system-ui,
          sans-serif;
        display: grid;
        gap: 14px;
      }
      h1 {
        margin: 0;
        font-size: 18px;
      }
      .row {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      .muted {
        color: var(--muted);
        font-size: 12px;
      }
      input[type="range"] {
        width: 280px;
        accent-color: var(--you);
      }
      button,
      a {
        font: inherit;
        color: var(--ink);
        background: #242a33;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
        text-decoration: none;
      }
      code {
        font:
          12px ui-monospace,
          monospace;
      }
    </style>
  </head>
  <body>
    <h1>Corrente webview spike</h1>
    <div class="muted">
      Instance <code id="instance">?</code> · editor opened <span id="opens">?</span> times ·
      <span id="polls">0</span> polls
    </div>
    <div class="row">
      <label for="gain">Gain</label>
      <input id="gain" type="range" min="0" max="1" step="0.001" />
      <code id="text">?</code>
    </div>
    <div class="muted">Drag it here, or automate Gain in the host: both should move it.</div>
    <div class="row">
      <button id="resize">Resize</button>
      <span class="muted" id="resized"></span>
      <a href="corrente://localhost/">Open the Corrente app</a>
    </div>
    <div class="row">
      <input placeholder="Type here: do keys reach the page?" style="width: 280px" />
    </div>
    <script>
      const send = (message) => window.ipc.postMessage(JSON.stringify(message));
      const gain = document.getElementById("gain");
      let dragging = false;
      let polls = 0;
      gain.addEventListener("pointerdown", () => {
        dragging = true;
        send({ type: "begin" });
      });
      gain.addEventListener("input", () => send({ type: "set", value: Number(gain.value) }));
      window.addEventListener("pointerup", () => {
        if (dragging) {
          dragging = false;
          send({ type: "end" });
        }
      });
      window.onPlugin = (state) => {
        document.getElementById("instance").textContent = state.instance;
        document.getElementById("opens").textContent = state.opens;
        document.getElementById("text").textContent = state.text;
        document.getElementById("polls").textContent = ++polls;
        if (!dragging) gain.value = state.gain;
      };
      let big = false;
      document.getElementById("resize").addEventListener("click", () => {
        big = !big;
        send({ type: "resize", width: big ? 900 : 640, height: big ? 600 : 420 });
      });
      window.onResized = (accepted) => {
        document.getElementById("resized").textContent = accepted ? "the host resized the window" : "the host refused";
      };
      setInterval(() => send({ type: "poll" }), 50);
      send({ type: "log", text: `loaded ${location.href}, ${innerWidth}x${innerHeight} at ${devicePixelRatio}x` });
      // Run with SPIKE_SELFTEST set, the page drives itself: a drag of Gain to a quarter, a resize,
      // then the app (when one is built in), each step checked through the plugin's own state.
      if (location.search === "?selftest") {
        const later = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
        (async () => {
          await later(300);
          send({ type: "begin" });
          send({ type: "set", value: 0.25 });
          send({ type: "end" });
          await later(300);
          const text = document.getElementById("text").textContent;
          send({
            type: "log",
            text: `selftest: Gain set to a quarter reads back as ${text} (${Number(gain.value).toFixed(3)})`,
          });
          window.onResized = (accepted) =>
            send({
              type: "log",
              text: `selftest: resize ${accepted ? "accepted" : "refused"}, now ${innerWidth}x${innerHeight}`,
            });
          send({ type: "resize", width: 900, height: 600 });
          await later(500);
          send({ type: "log", text: `selftest: after the resize the page is ${innerWidth}x${innerHeight}` });
          location.href = "corrente://localhost/";
        })();
      }
      const firstState = window.onPlugin;
      window.onPlugin = (state) => {
        firstState(state);
        if (polls === 1) send({ type: "log", text: `first state: ${JSON.stringify(state)}` });
      };
    </script>
  </body>
</html>
