[package]
name = "webview-spike"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

# PLUGIN-2.2: does a webview editor work in a plugin window? See src/lib.rs.
[lib]
# cdylib for the plugin bundles, lib for the standalone program (src/main.rs) to link.
crate-type = ["cdylib", "lib"]

[dependencies]
# assert_process_allocs: any allocation on the audio thread fails loudly in a debug build.
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de42101", features = ["assert_process_allocs", "standalone"] }
wry = "0.57"
raw-window-handle = "0.6"
serde_json = "1"
# The same macOS bindings wry uses: to ask whether the host's view is in a window yet, and to try again
# on the main thread's next turn when it isn't.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow"] }
dispatch2 = "0.3"
