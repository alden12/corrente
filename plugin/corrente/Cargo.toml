[package]
name = "corrente"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

# Corrente's devices as a plugin (PLUGIN-2, PLUGIN-3), on the app's engine. See src/lib.rs.
[lib]
crate-type = ["cdylib"]

[dependencies]
# nice-plug, the maintained fork of nih-plug (which is in maintenance mode). assert_process_allocs: any
# allocation on the audio thread fails loudly in a debug build.
nice-plug = { version = "0.4.2", features = ["assert_process_allocs"] }
# The app's engine as a Rust library (needs engine/gen/: `node engine/compile.ts --gen`).
corrente-engine-native = { path = "../../engine/native" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A package's samples are base64 in its JSON, and its sample files are decoded here.
base64 = "0.22"
symphonia = { version = "0.5", features = ["mp3"] }
# The window (editor.rs): the app's device rack in a webview, attached to the host's view.
wry = "0.57"

# The same macOS bindings wry uses: to ask whether the host's view is in a window yet, and to try again
# on the main thread's next turn when it isn't.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow"] }
dispatch2 = "0.3"
