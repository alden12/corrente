# The plugin (PLUGIN-1): Corrente's devices as a CLAP and VST3, built with nice-plug.
# `corrente` is the plugin; its window is the app's device rack in a webview (PLUGIN-3.2). Bundle with
# `cargo xtask bundle <package> --release`, which writes target/bundled/.
[workspace]
resolver = "3"
members = ["corrente", "xtask"]
