# The plugin (PLUGIN-1): Corrente's devices as a CLAP and VST3, built with nih-plug.
# `corrente` is the plugin (PLUGIN-2's proof of concept so far); `webview-spike` is PLUGIN-2.2's
# spike, a webview editor in a plugin window. Bundle with
# `cargo xtask bundle <package> --release`, which writes target/bundled/.
[workspace]
resolver = "3"
members = ["corrente", "webview-spike", "xtask"]
